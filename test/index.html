<!doctype html>
<meta charset="utf-8">
<title>Conversion harness</title>
<style>
  body { font: 14px system-ui; margin: 24px; }
  .brand { fill: #e91e63; }
  .blue { color: #1a73e8; }
  .icon { width: 48px; height: 48px; fill: #e91e63; }
  #css-class { width: 120px; height: 60px; }
</style>
<h1>Conversion harness</h1>
<p>Run <code>npm run test:build</code>, then call <code>await runTests()</code> or click the button.</p>

<!-- sprite sheet / shared defs living elsewhere in the page -->
<svg style="display:none" aria-hidden="true">
  <symbol id="star" viewBox="0 0 10 10"><rect width="10" height="10"/></symbol>
  <linearGradient id="rg"><stop offset="0" stop-color="#f00"/><stop offset="1" stop-color="#00f"/></linearGradient>
</svg>

<svg id="css-class" viewBox="0 0 20 10"><rect class="brand" width="20" height="10"/></svg>
<span class="blue"><svg id="current-color" viewBox="0 0 10 10" width="40" height="40"><rect width="10" height="10" fill="currentColor"/></svg></span>
<svg id="sprite-use" class="icon"><use href="#star"/></svg>
<svg id="ext-gradient" viewBox="0 0 100 20" width="100" height="20"><rect width="100" height="20" fill="url(#rg)"/></svg>

<p><button onclick="runTests()">Run tests</button></p>
<div id="results"></div>
<script src="dist/harness.js"></script>
